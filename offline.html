<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Premium Jet Detailing</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --gold: #c89a3d;
      --gold-soft: #efd28d;
      --ivory: #f6efe3;
      --muted: #a99f91;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px 22px;
      color: var(--ivory);
      background:
        radial-gradient(circle at 50% 26%, rgba(200, 154, 61, 0.09), transparent 30rem),
        linear-gradient(145deg, #050505 0%, #090806 52%, #030303 100%);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    main { width: min(100%, 520px); }

    .rule {
      width: 88px;
      height: 1px;
      margin: 0 auto 26px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      box-shadow: 0 0 14px rgba(200, 154, 61, 0.2);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 9vw, 3.8rem);
      font-weight: 400;
      letter-spacing: 0.075em;
      text-indent: 0.075em;
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1.7;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"></div>
    <h1>Premium Jet Detailing</h1>
    <p>Website temporarily unavailable</p>
  </main>
</body>
</html>
